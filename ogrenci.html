<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öğrenci Quiz Paneli</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e293b,#334155);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.panel{
    width:900px;
    background:rgba(255,255,255,0.96);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
}

.topbar{
    background:linear-gradient(135deg,#ec4899,#be185d);
    color:white;
    padding:28px 35px;
}

.topbar h1{
    font-size:30px;
    font-weight:700;
}

.topbar p{
    margin-top:8px;
    opacity:0.92;
    font-size:15px;
}

.content{
    display:grid;
    grid-template-columns:2fr 1fr;
}

.left{
    padding:35px;
}

.right{
    background:#f8fafc;
    padding:35px;
    border-left:1px solid #e2e8f0;
}

.label{
    font-size:14px;
    font-weight:600;
    color:#334155;
    margin-bottom:8px;
    display:block;
}

.card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
}

.stat{
    font-size:28px;
    font-weight:800;
    color:#ec4899;
    margin-top:10px;
}

.status{
    padding:10px 14px;
    border-radius:12px;
    font-weight:600;
    background:#dcfce7;
    color:#166534;
    display:inline-block;
    margin-top:10px;
}

.footer-note{
    margin-top:12px;
    font-size:13px;
    color:#64748b;
}

.question-box {
    background: #f1f5f9;
    border: 2px dashed #cbd5e1;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.question-text {
    font-size: 20px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 20px;
    text-align: left;
}

.options-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.option-btn {
    padding: 14px 18px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    font-size: 16px;
    font-weight: 500;
    color: #334155;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.option-btn:hover {
    background: #fdf2f8;
    border-color: #ec4899;
    color: #be185d;
}

.waiting-text {
    color: #64748b;
    font-size: 16px;
    font-weight: 500;
}

@media(max-width:950px){
    .panel{ width:100%; }
    .content{ grid-template-columns:1fr; }
    .right{ border-left:none; border-top:1px solid #e2e8f0; }
}
</style>
</head>

<body>

<div class="panel">

    <div class="topbar">
        <h1>Öğrenci Quiz Paneli</h1>
    </div>

    <div class="content">

        <div class="left">
            <label class="label">Gelen Soru</label>
            
            <div class="question-box" id="questionBox">
                <div class="waiting-text">Bekleniyor...<br><br>Öğretmenin soru göndermesi bekleniyor.</div>
            </div>

        </div>

        <div class="right">

            <div class="card">
                <div>Bağlantı Durumu</div>
                <div class="status" id="durum">Bağlanıyor...</div>
            </div>

            <div class="card">
                <div>Panel Sahibi</div>
                <div class="stat">İlknur</div>
                <div class="footer-note">Sisteme öğrenci olarak bağlı.</div>
            </div>

            <div class="card">
                <div>Canlı Bağlantı</div>
                <div class="footer-note">
                    Sorular ve şıklar anında ekranda görünür.
                </div>
            </div>

        </div>

    </div>

</div>

<script>

const ws = new WebSocket("ws://localhost:8765");

ws.onopen = () => {
    document.getElementById("durum").innerText = "Bağlandı";
    ws.send(JSON.stringify({
        rol: "ogrenci",
        isim: "İlknur"
    }));
};

ws.onclose = () => {
    const durumEl = document.getElementById("durum");
    durumEl.innerText = "Bağlantı Kesildi";
    durumEl.style.background = "#fee2e2";
    durumEl.style.color = "#991b1b";
};

ws.onerror = () => {
    const durumEl = document.getElementById("durum");
    durumEl.innerText = "Hata Oluştu";
    durumEl.style.background = "#fee2e2";
    durumEl.style.color = "#991b1b";
};

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    
    // Öğretmenden "soru" paketi gelirse
    if (data.tip === "soru") {
        const questionBox = document.getElementById("questionBox");
        
        // Görsel stilleri sıfırla
        questionBox.style.background = "transparent";
        questionBox.style.border = "none";
        questionBox.style.padding = "0";
        questionBox.style.justifyContent = "flex-start";
        
        let htmlContent = `<div class="question-text">${data.soru}</div>`;
        
        if (data.secenekler && data.secenekler.length > 0) {
            htmlContent += `<div class="options-container">`;
            data.secenekler.forEach((secenek, index) => {
                const harf = String.fromCharCode(65 + index); // A, B, C, D...
                htmlContent += `<button class="option-btn"><b>${harf})</b> ${secenek}</button>`;
            });
            htmlContent += `</div>`;
        } else {
            // Şık gönderilmediğinde veya veri eksik geldiğinde sadece soru eklensin
            htmlContent += `<div class="waiting-text" style="margin-top:20px; text-align:left;">*Bu soru için şık gönderilmedi.</div>`;
        }
        
        questionBox.innerHTML = htmlContent;
    }
};

</script>

</body>
</html>
